apiVersion: v1
kind: Pod
metadata:
  name: vcfa-cloudshell-${USER_ID}
  namespace: my-vcfa-project-namespace
  labels:
    app: vcfa-cloudshell-${USER_ID}
spec:
  containers:
  - name: cloudshell
    # In a real environment, point to your internal Harbor registry
    image: vcfa-cloudshell:latest 
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8080
    env:
    - name: VCFA_FQDN
      value: "${VCFA_FQDN}"
    - name: VCFA_TENANT
      value: "${VCFA_TENANT}"
    - name: VCFA_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: ${USER_ID}-vcfa-token-secret
          key: token
---
apiVersion: v1
kind: Secret
metadata:
  name: ${USER_ID}-vcfa-token-secret
  namespace: my-vcfa-project-namespace
type: Opaque
stringData:
  # In a real workflow, this token is dynamically generated and injected here
  token: "${VCFA_API_TOKEN}"
---
apiVersion: v1
kind: Service
metadata:
  name: vcfa-cloudshell-${USER_ID}-service
  namespace: my-vcfa-project-namespace
spec:
  selector:
    app: vcfa-cloudshell-${USER_ID}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer # Exposes the pod IP/port on the network
