apiVersion: v1
kind: Pod
metadata:
  name: vcfa-cloudshell-user1
  namespace: my-vcfa-project-namespace
  labels:
    app: vcfa-cloudshell
spec:
  containers:
  - name: cloudshell
    # In a real environment, point to your internal Harbor registry
    image: vcfa-cloudshell:latest 
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 8080
    env:
    - name: VCFA_FQDN
      value: "vcfa.corp.local"
    - name: VCFA_TENANT
      value: "developer-org"
    - name: VCFA_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: user-vcfa-token-secret
          key: token
---
apiVersion: v1
kind: Secret
metadata:
  name: user-vcfa-token-secret
  namespace: my-vcfa-project-namespace
type: Opaque
stringData:
  # In a real workflow, this token is dynamically generated and injected here
  token: "vcf-temp-api-token-xyz123"
---
apiVersion: v1
kind: Service
metadata:
  name: vcfa-cloudshell-service
  namespace: my-vcfa-project-namespace
spec:
  selector:
    app: vcfa-cloudshell
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer # Exposes the pod IP/port on the network
